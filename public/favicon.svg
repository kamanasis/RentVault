<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="rv-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="rv-shield-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#06B6D4" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Badge -->
  <rect width="32" height="32" rx="8" fill="url(#rv-bg-grad)" />

  <!-- Subtle Inner Border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" stroke="#93C5FD" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Shield Shape -->
  <path d="M16 5.5L7.5 9.5V15.5C7.5 21 11.2 25.5 16 27C20.8 25.5 24.5 21 24.5 15.5V9.5L16 5.5Z" 
        fill="#07111F" 
        fill-opacity="0.35" 
        stroke="url(#rv-shield-glow)" 
        stroke-width="1.75" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Vault Lock / Keyhole Center -->
  <!-- Lock Shackle -->
  <path d="M13.5 14V12C13.5 10.62 14.62 9.5 16 9.5C17.38 9.5 18.5 10.62 18.5 12V14" 
        stroke="#FFFFFF" 
        stroke-width="1.5" 
        stroke-linecap="round" />
  <!-- Lock Body -->
  <rect x="12" y="14" width="8" height="6.5" rx="1.5" fill="#FFFFFF" />
  <!-- Keyhole Dot -->
  <circle cx="16" cy="16.5" r="1" fill="#1E40AF" />
  <path d="M16 17.5V19" stroke="#1E40AF" stroke-width="1" stroke-linecap="round" />
</svg>
