name: RentVault CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Test Suite & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Soroban Smart Contract Tests (8 Unit Tests)
        run: npm run test:contract

      - name: Compile Soroban Smart Contract WASM
        run: npm run build:contract

      - name: Run Code Style & Linter Checks
        run: npm run lint

      - name: Run Frontend Automated Test Suite (42 Unit Tests across 10 Suites)
        run: npm test

      - name: Build Production Web Application
        run: npm run build

